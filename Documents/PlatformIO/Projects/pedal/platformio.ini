[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino

board_build.core = earlephilhower

; This is the flag that was missing — it's what USBAudioStream.h actually
; checks for to select the TinyUSB platform subclass (USBAudioDeviceTinyUSB).
; Without it, the header falls through to the #error you hit.
build_flags =
    -DUSE_TINYUSB

monitor_speed = 115200

lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git